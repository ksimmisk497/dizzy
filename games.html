  <style>
    /* Games home screen */
    #home-frame { overflow-y: auto; }

    #games-inner {
      padding: 16px 20px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }

    #game-search-wrap { text-align: center; padding: 16px 0 10px; }
    #searchInput {
      padding: 11px 18px;
      border: 1px solid #2a2a35;
      border-radius: 10px;
      font-size: 14px;
      width: min(420px, 92vw);
      background: #14141c;
      color: #fff;
      outline: none;
      font-family: 'Open Sans', sans-serif;
      transition: border-color .2s, box-shadow .2s;
    }
    #searchInput::placeholder { color: #4a4a58; }
    #searchInput:focus { border-color: #6c7cff; box-shadow: 0 0 0 3px rgba(108,124,255,0.18); }

    /* Letter sections */
    #sections-container { margin-top: 8px; }
    .letter-section { margin-bottom: 28px; }
    .letter-header {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #444;
      padding: 6px 0 10px;
      border-bottom: 1px solid #1c1c28;
      margin-bottom: 12px;
    }
    .buttons-grid { display: flex; flex-wrap: wrap; gap: 8px; }

    input[type="button"] {
      padding: 9px 16px;
      background: #14141c;
      color: #d0d0e0;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Open Sans', sans-serif;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap;
    }
    input[type="button"]:hover { background: #1e1e2e; border-color: #6c7cff; color: #fff; }
    input[type="button"]:active { background: #252535; }

    .letter-section.hidden { display: none; }

    /* Premium game-library presentation */
    #game-search-wrap { position: sticky; top: 0; z-index: 5; padding: 18px 0 14px; }
    #game-search-wrap::before {
      content: '';
      position: absolute;
      inset: 0 -20px;
      z-index: -1;
      background: linear-gradient(to bottom, rgba(10,10,15,.96) 55%, rgba(10,10,15,.72), transparent);
      pointer-events: none;
    }
    #searchInput {
      box-shadow: 0 10px 35px rgba(0,0,0,.28), 0 0 0 1px rgba(108,124,255,.03);
    }
    #searchInput:hover { border-color: rgba(108,124,255,.42); }
    .letter-section { animation: gamesSectionIn .35s ease both; }
    .letter-header {
      position: sticky;
      top: 66px;
      z-index: 2;
      background: rgba(10,10,15,.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    input[type="button"] {
      box-shadow: inset 0 1px 0 rgba(255,255,255,.018);
      transition: transform .14s ease, background .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease;
    }
    input[type="button"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(0,0,0,.20), 0 0 0 1px rgba(108,124,255,.08);
    }
    input[type="button"]:active { transform: translateY(0); }
    @keyframes gamesSectionIn { from { opacity: .72; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .letter-section { animation: none; } }

100% { background-position: -200% 0; } }
  
    #site-footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      z-index: 50;
      text-align: center;
      padding: 8px 0;
      font-size: 12px;
      color: #555;
      background: #0a0a0f;
      border-top: 1px solid #1c1c28;
      pointer-events: none;
    }
    #tab-content-area { bottom: 32px !important; }
</style>

  <script>
    (function () {
      function desired() {
        try {
          var c = JSON.parse(localStorage.getItem('dizzy_cloak_v1') || '{}');
          return (c && c.title) ? c.title : 'Dizzy';
        } catch (e) { return 'Dizzy'; }
      }
      document.title = desired();
      setInterval(function () {
        var d = desired();
        if (document.title !== d) document.title = d;
      }, 1500);
    })();
  </script>

  <script>
    // Warm UV as soon as config exists
    (function warm() {
      if (typeof __uv$config === 'undefined' || typeof registerSW !== 'function') {
        return setTimeout(warm, 50);
      }
      registerSW().catch(function(){});
    })();
  </script>
  
  <script defer>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.BrowserTabs) BrowserTabs.init({ homeLabel: 'Games' });

      // Only clean "cl" prefix — do NOT block UGS game opens
      function stripCl(el) {
        if (!el || el.tagName !== 'INPUT' || el.type !== 'button') return;
        var v = el.value || '';
        if (v.indexOf('cl') === 0) el.value = v.slice(2);
      }
      document.querySelectorAll('input[type="button"]').forEach(stripCl);
      var obs = new MutationObserver(function(muts) {
        muts.forEach(function(m) {
          m.addedNodes.forEach(function(node) {
            if (node.nodeType !== 1) return;
            if (node.tagName === 'INPUT') stripCl(node);
            if (node.querySelectorAll) node.querySelectorAll('input[type="button"]').forEach(stripCl);
          });
        });
      });
      obs.observe(document.body, { childList: true, subtree: true });

      var searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function() {
          var q = searchInput.value.trim().toLowerCase();
          document.querySelectorAll('#sections-container input[type="button"]').forEach(function(btn) {
            btn.style.display = (!q || (btn.value || '').toLowerCase().includes(q)) ? '' : 'none';
          });
          document.querySelectorAll('.letter-section').forEach(function(sec) {
            var vis = sec.querySelectorAll('input[type="button"]:not([style*="display: none"])').length;
            sec.classList.toggle('hidden', vis === 0);
          });
        });
      }
});
  </script>

  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <script>
  (function () {
    var canvas = document.getElementById('particles-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var dots = [];
    var mouse = { x: -9999, y: -9999 };
    var colors = ['#8b7cf7', '#6c7cff', '#a78bfa', '#c4b5fd'];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var count = Math.min(70, Math.floor((canvas.width * canvas.height) / 18000));
      dots = [];
      for (var i = 0; i < count; i++) {
        dots.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          r: Math.random() * 2 + 0.8,
          c: colors[(Math.random() * colors.length) | 0],
          a: Math.random() * 0.4 + 0.28,
          tw: Math.random() * Math.PI * 2,
          tws: 0.02 + Math.random() * 0.04
        });
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', function (e) {
      mouse.x = e.clientX; mouse.y = e.clientY;
    });
    resize();

    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < dots.length; i++) {
        var p = dots[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        for (var j = i + 1; j < dots.length; j++) {
          var q = dots[j];
          var dx = p.x - q.x, dy = p.y - q.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < 140) {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(108,124,255,' + (0.32 * (1 - d / 140)).toFixed(3) + ')';
            ctx.lineWidth = 1;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
        var mdx = mouse.x - p.x, mdy = mouse.y - p.y;
        var md = Math.sqrt(mdx * mdx + mdy * mdy);
        if (md < 140) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(167,139,250,' + (0.38 * (1 - md / 150)).toFixed(3) + ')';
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
        p.tw += p.tws || 0.03;
        var twinkle = 0.55 + 0.45 * Math.sin(p.tw || 0);
        // occasional stronger pulse
        if (((Math.sin(p.tw * 0.35) + 1) * 0.5) > 0.97) twinkle = 1;
        ctx.beginPath();
        ctx.fillStyle = p.c;
        ctx.globalAlpha = Math.min(1, (p.a || 0.3) * twinkle);
        ctx.arc(p.x, p.y, p.r * (0.85 + 0.25 * twinkle), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
