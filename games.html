      width: min(420px, 92vw);

    /* Letter sections */

    input[type="button"] {
      padding: 9px 16px;

      color: #d0d0e0;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Open Sans', sans-serif;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap;
    }
    input[type="button"]:hover { background: #1e1e2e; border-color: #6c7cff; color: #fff; }
    input[type="button"]:active { background: #252535; }

    .letter-section.hidden { display: none; }
100% { background-position: -200% 0; } }
  
    #site-footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      z-index: 50;
      text-align: center;
      padding: 8px 0;
      font-size: 12px;
      color: #555;
      background: #0a0a0f;
      border-top: 1px solid #1c1c28;
      pointer-events: none;
    }
    #tab-content-area { bottom: 32px !important; }

    /* PPFN-style game tiles */
    #sections-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 8px 16px 40px;
    }
    .letter-section { margin-bottom: 22px; }
    .letter-header {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #8b8ba0;
      margin: 8px 4px 12px;
      text-transform: uppercase;
    }
    .buttons-grid {
      display: grid !important;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)) !important;
      gap: 12px !important;
    }
    .buttons-grid input[type="button"] { display: none !important; }
    .game-tile {
      background: rgba(20, 20, 28, 0.92);
      border: 1px solid #2a2a35;
      border-radius: 14px;
      padding: 10px 8px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, transform .15s, box-shadow .15s;
      color: #e0e0ef;
      font-family: inherit;
      width: 100%;
    }
    .game-tile:hover {
      border-color: rgba(108,124,255,0.55);
      transform: translateY(-2px);
      box-shadow: 0 0 0 2px rgba(108,124,255,0.12), 0 8px 20px rgba(0,0,0,0.35);
    }
    .game-tile .game-logo-img {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      object-fit: cover;
      display: block;
      margin: 0 auto 8px;
      background: #12121a;
    }
    .game-tile .game-logo {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      color: #fff;
      margin: 0 auto 8px;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .game-tile .game-title {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.25;
      max-height: 2.5em;
      overflow: hidden;
      color: #c8c8d8;
    }
    .game-tile:hover .game-title { color: #fff; }

  <script>
    (function () {
      function desired() {
        try {
          var c = JSON.parse(localStorage.getItem('dizzy_cloak_v1') || '{}');
          return (c && c.title) ? c.title : 'Dizzy';
        } catch (e) { return 'Dizzy'; }
      }
      document.title = desired();
      setInterval(function () {
        var d = desired();
        if (document.title !== d) document.title = d;
      }, 1500);
    })();
  </script>

  <script>
  (function () {
    function titleFromFile(name) {
      var t = String(name || '');
      if (t.indexOf('cl') === 0) t = t.slice(2);
      t = t.replace(/\.(html?|txt|docx)$/i, '');
      t = t.replace(/([a-z])([A-Z])/g, '$1 $2');
      t = t.replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2');
      t = t.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
      return t || name;
    }

    function letterOf(title) {
      var c = (title || '#').charAt(0).toUpperCase();
      return /[A-Z]/.test(c) ? c : '#';
    }

    function openLocalGame(file, title) {
      var path = 'vendor/games/' + file;
      // absolute-from-site path for GH pages subpath
      try {
        path = new URL('vendor/games/' + encodeURI(file), location.href).pathname;
        // keep relative for portability
        path = 'vendor/games/' + file.split('/').map(encodeURIComponent).join('/');
      } catch (e) {
        path = 'vendor/games/' + file;
      }
      if (window.BrowserTabs && BrowserTabs.openTab) {
        BrowserTabs.openTab(path, title || titleFromFile(file));
      } else {
        location.href = path;
      }
    }
    window.openLocalGame = openLocalGame;

    function renderGames(list) {
      var container = document.getElementById('sections-container');
      if (!container) return;
      container.innerHTML = '';
      var byLetter = {};
      list.forEach(function (g) {
        var L = g.letter || letterOf(g.title);
        if (!byLetter[L]) byLetter[L] = [];
        byLetter[L].push(g);
      });
      Object.keys(byLetter).sort(function (a, b) {
        if (a === '#') return 1;
        if (b === '#') return -1;
        return a.localeCompare(b);
      }).forEach(function (L) {
        var sec = document.createElement('div');
        sec.className = 'letter-section';
        sec.dataset.letter = L;
        var h = document.createElement('div');
        h.className = 'letter-header';
        h.textContent = L;
        sec.appendChild(h);
        var grid = document.createElement('div');
        grid.className = 'buttons-grid';
        byLetter[L].sort(function (a, b) {
          return a.title.toLowerCase().localeCompare(b.title.toLowerCase());
        }).forEach(function (g) {
          var tile = document.createElement('button');
          tile.type = 'button';
          tile.className = 'game-tile';
          tile.title = g.title;
          var logo = document.createElement('img');
          logo.className = 'game-logo-img';
          logo.alt = g.title;
          logo.loading = 'lazy';
          var svgUri = makeLogoDataUri(g.title || g.file);
          logo.src = (g.logo || g.imgSrc || svgUri);
          logo.onerror = function () { this.onerror = null; this.src = svgUri; };
          // always prefer generated so every tile has a visible logo
          logo.src = svgUri;
          var title = document.createElement('div');
          title.className = 'game-title';
          title.textContent = g.title;
          tile.appendChild(logo);
          tile.appendChild(title);
          tile.addEventListener('click', function (e) {
            e.preventDefault();
            openLocalGame(g.file, g.title);
          });
          grid.appendChild(tile);
        });
        sec.appendChild(grid);
        container.appendChild(sec);
      });
    }

    
    function makeLogoDataUri(title) {
      var ini = logoInitials(title);
      var s = String(title || '');
      var hash = 0;
      for (var i = 0; i < s.length; i++) hash = ((hash << 5) - hash) + s.charCodeAt(i);
      hash = Math.abs(hash);
      var hues = [250, 265, 280, 210, 195, 320, 230, 290, 175, 300];
      var h = hues[hash % hues.length];
      var l = 38 + (hash % 18);
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="hsl(' + h + ',70%,' + (l + 10) + '%)"/>' +
        '<stop offset="100%" stop-color="hsl(' + ((h + 28) % 360) + ',65%,' + l + '%)"/>' +
        '</linearGradient></defs>' +
        '<rect width="128" height="128" rx="28" fill="url(#g)"/>' +
        '<text x="64" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#fff">' +
        ini.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</text></svg>';
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function logoInitials(title) {
      var parts = String(title || '?').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '?';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
    }

    function logoColor(title) {
      var s = String(title || '');
      var hash = 0;
      for (var i = 0; i < s.length; i++) hash = ((hash << 5) - hash) + s.charCodeAt(i);
      hash = Math.abs(hash);
      var hues = [250, 265, 280, 210, 195, 320, 230, 290];
      var h = hues[hash % hues.length];
      var l = 38 + (hash % 18);
      return 'linear-gradient(145deg, hsl(' + h + ' 70% ' + (l + 8) + '%), hsl(' + ((h + 25) % 360) + ' 65% ' + l + '%))';
    }

    function boot() {
      if (window.BrowserTabs) BrowserTabs.init({ homeLabel: 'Games' });

      fetch('vendor/games-manifest.json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (list) {
          window.__dizzyGames = list;
          renderGames(list);
        })
        .catch(function () {
          // fallback: build from embedded minimal list
          var fallback = [];
          renderGames(fallback);
          var c = document.getElementById('sections-container');
          if (c) c.innerHTML = '<p style="color:#888;text-align:center;padding:20px">No local games found. Put HTML files in vendor/games/ and rebuild manifest.</p>';
        });

      var searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          var q = searchInput.value.trim().toLowerCase();
          var list = window.__dizzyGames || [];
          if (!q) { renderGames(list); return; }
          renderGames(list.filter(function (g) {
            return (g.title || '').toLowerCase().indexOf(q) !== -1 ||
                   (g.file || '').toLowerCase().indexOf(q) !== -1;
          }));
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else boot();
  })();
  </script>

  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <script>
  (function () {
    var canvas = document.getElementById('particles-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var dots = [];
    var mouse = { x: -9999, y: -9999 };
    var colors = ['#8b7cf7', '#6c7cff', '#a78bfa', '#c4b5fd'];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var count = Math.min(70, Math.floor((canvas.width * canvas.height) / 18000));
      dots = [];
      for (var i = 0; i < count; i++) {
        dots.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          r: Math.random() * 2 + 0.8,
          c: colors[(Math.random() * colors.length) | 0],
          a: Math.random() * 0.4 + 0.28,
          tw: Math.random() * Math.PI * 2,
          tws: 0.02 + Math.random() * 0.04
        });
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', function (e) {
      mouse.x = e.clientX; mouse.y = e.clientY;
    });
    resize();

    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < dots.length; i++) {
        var p = dots[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        for (var j = i + 1; j < dots.length; j++) {
          var q = dots[j];
          var dx = p.x - q.x, dy = p.y - q.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < 140) {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(108,124,255,' + (0.32 * (1 - d / 140)).toFixed(3) + ')';
            ctx.lineWidth = 1;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
        var mdx = mouse.x - p.x, mdy = mouse.y - p.y;
        var md = Math.sqrt(mdx * mdx + mdy * mdy);
        if (md < 140) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(167,139,250,' + (0.38 * (1 - md / 150)).toFixed(3) + ')';
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
        p.tw += p.tws || 0.03;
        var twinkle = 0.55 + 0.45 * Math.sin(p.tw || 0);
        // occasional stronger pulse
        if (((Math.sin(p.tw * 0.35) + 1) * 0.5) > 0.97) twinkle = 1;
        ctx.beginPath();
        ctx.fillStyle = p.c;
        ctx.globalAlpha = Math.min(1, (p.a || 0.3) * twinkle);
        ctx.arc(p.x, p.y, p.r * (0.85 + 0.25 * twinkle), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
