<!DOCTYPE html>
<html lang="en">
<head>

<script>
(function () {
  var embed = /(?:\?|&)embed=1(?:&|$)/.test(location.search) || window !== window.top;
  if (embed) document.documentElement.classList.add("dizzy-embed");
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dizzy</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="browser.css">
<style>
#home-frame { overflow: auto; }
.wrap {
  padding: 16px 18px 32px;
  width: 100%;
  max-width: none !important;
  box-sizing: border-box;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.row h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
.count { color: var(--muted); font-size: 13px; font-weight: 500; }
#g-search {
  flex: 1;
  min-width: 160px;
  padding: 11px 16px;
  border-radius: 999px;
  border: 1px solid rgba(155, 92, 255, 0.45);
  background: #120a1c;
  color: #f5eaff;
  font-family: var(--font);
  outline: none;
}
#g-search:focus { border-color: color-mix(in srgb, var(--acc) 40%, transparent); }
.g-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
  width: 100%;
}
.g-card {
  padding: 10px; text-align: center; cursor: pointer; color: var(--ink);
  font-family: var(--font); background: var(--raise); border: 1px solid var(--line); border-radius: 14px;
}
.g-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #0a0a0c; margin-bottom: 8px; display: block; }
.g-card .n { font-size: 12px; font-weight: 650; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.g-status { text-align: center; color: var(--muted); padding: 28px; font-size: 14px; }
.g-more {
  display: block; margin: 16px auto; padding: 10px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--raise2); color: var(--ink);
  font-family: var(--font); font-weight: 650; cursor: pointer;
}

.wrap, #apps-inner, #settings-inner, #games-shell {
  animation: pageInLocal 0.4s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes pageInLocal {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.g-card, .app-card, .s-card {
  animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

#full-width-games, .wrap {
  width: 100% !important;
  max-width: none !important;
}
#g-search::placeholder { color: #7a5a9a; }
.g-card {
  background: #120a1c !important;
  border-color: rgba(155, 92, 255, 0.35) !important;
  color: #f5eaff !important;
  font-family: var(--font) !important;
}
.row h1, .count { font-family: var(--font) !important; }
.count { color: #b89ad4 !important; }
</style>
<style id="full-bleed-fix">
html,body{width:100%!important;height:100%!important;overflow:hidden!important}
#tab-content-area{position:fixed!important;top:var(--chrome-h)!important;left:var(--rail)!important;right:0!important;bottom:0!important;width:auto!important;height:auto!important}
#home-frame,.tab-frame,#tab-content-area iframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important;max-width:none!important;max-height:none!important}
#home-frame.active,.tab-frame.active{display:block!important}

.wrap, #apps-inner, #settings-inner, #games-shell {
  animation: pageInLocal 0.4s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes pageInLocal {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.g-card, .app-card, .s-card {
  animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

#full-width-games, .wrap {
  width: 100% !important;
  max-width: none !important;
}
#g-search::placeholder { color: #7a5a9a; }
.g-card {
  background: #120a1c !important;
  border-color: rgba(155, 92, 255, 0.35) !important;
  color: #f5eaff !important;
  font-family: var(--font) !important;
}
.g-card .s { color: #9b5cff !important; font-size: 9px; }
.row h1, .count { font-family: var(--font) !important; }
.count { color: #b89ad4 !important; }
</style>
</head>
<body>
<nav class="rail" aria-label="Main">
<img class="rail-logo" src="favicon.png" alt="Dizzy">
<a href="index.html" data-label="Home"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg></a>
<a href="games.html" class="active" data-label="Games"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="3"/><path d="M8 12h2M7 10v4M16 11h.01M18 13h.01"/></svg></a>
<a href="apps.html" data-label="Apps"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></a>
<a href="settings.html" data-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></a>
<div class="rail-spacer"></div></nav>

<div id="browser-chrome">
  <div id="tab-bar">
    <div class="tab active" id="home-tab" onclick="BrowserTabs.switchTab('home')">
      <img class="tab-favicon" src="favicon.png" onerror="this.style.display='none'">
      <span class="tab-title">Games</span>
    </div>
    <button id="new-tab-btn" onclick="BrowserTabs.openTab(null)" title="New Tab">+</button>
  </div>
  <div id="address-bar-row">
    <button class="nav-btn" id="btn-back" onclick="BrowserTabs.tabBack()">&#8592;</button>
    <button class="nav-btn" id="btn-forward" onclick="BrowserTabs.tabForward()">&#8594;</button>
    <button class="nav-btn" id="btn-reload" onclick="BrowserTabs.tabReload()">&#8635;</button>
    <input id="address-input" class="home-tab" type="text" value="Games" autocomplete="off"
           onfocus="BrowserTabs.addressFocus()" onblur="BrowserTabs.addressBlur()"
           onkeydown="if(event.key==='Enter')BrowserTabs.addressGo()">
  </div>
</div>

<div id="tab-content-area">
  <div id="home-frame" class="active">
    <div class="wrap">
      <div class="row">
        <h1>Games</h1>
        <span class="count" id="g-count">…</span>
        <input id="g-search" type="search" placeholder="Search" autocomplete="off">
      </div>
      <div class="g-status" id="g-status">Loading…</div>
      <div class="g-grid" id="g-grid"></div>
      <button type="button" class="g-more" id="g-more" style="display:none">Load more</button>
    </div>
  </div>
</div>

<script src="uv/uv.bundle.js" defer></script>
<script src="uv/uv.config.js" defer></script>
<script src="register-sw.js" defer></script>
<script src="search.js" defer></script>
<script src="browser.js"></script>
<script src="cloak.js"></script>
<script src="browser-ua.js"></script>

<script src="games-sources.js"></script>
<script>
(function(){
  if (window.BrowserTabs) try { BrowserTabs.init({ homeLabel: 'Games' }); } catch(e){}
  if (typeof DizzyGames === 'undefined') {
    document.getElementById('g-status').textContent = 'Missing games-sources.js';
    return;
  }
  var list=[], filtered=[], shown=0, PAGE=80;
  var grid=document.getElementById('g-grid');
  var status=document.getElementById('g-status'), count=document.getElementById('g-count');
  var more=document.getElementById('g-more'), search=document.getElementById('g-search');
  function applyFilter(){
    var q=(search.value||'').trim().toLowerCase();
    filtered=!q?list.slice():list.filter(function(g){return (g.name||'').toLowerCase().indexOf(q)!==-1});
    shown=0; grid.innerHTML=''; count.textContent=filtered.length+' games';
    status.style.display=filtered.length?'none':'block'; status.textContent=filtered.length?'':'No matches';
    renderMore();
  }
  function renderMore(){
    filtered.slice(shown,shown+PAGE).forEach(function(g){
      var c=document.createElement('button'); c.type='button'; c.className='g-card';
      c.innerHTML="<img loading='lazy' alt=''><div class='n'></div>";
      var img=c.querySelector('img'); img.src=g.img||'favicon.png'; img.alt=g.name||'Game'; img.onerror=function(){this.src='favicon.png'};
      c.querySelector('.n').textContent=g.name;
      c.onclick=function(e){e.preventDefault();DizzyGames.openGame(g.url,g.name)};
      grid.appendChild(c);
    });
    shown=Math.min(filtered.length,shown+PAGE);
    more.style.display=shown<filtered.length?'block':'none';
  }
  more.onclick=renderMore;
  search.oninput=function(){clearTimeout(search._t);search._t=setTimeout(applyFilter,200)};
  async function load(){
    status.style.display='block'; status.textContent='Loading…'; grid.innerHTML='';
    try {
      list=await DizzyGames.loadStash('all');
      applyFilter();
      if(!list.length){status.style.display='block';status.textContent='No games found'}
    } catch(e) {
      status.textContent='Could not load games';
    }
  }
  load();
})();
</script>
<script src="teacher-watch.js"></script>
<script src="notifications.js"></script>
</body>
</html>
