    /* Games home screen */
    #home-frame { overflow-y: auto; }

    #games-inner {
      padding: 16px 20px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }

    #game-search-wrap { text-align: center; padding: 16px 0 10px; }
    #searchInput {
      padding: 11px 18px;
      border: 1px solid #2a2a35;
      border-radius: 10px;
      font-size: 14px;
      width: min(420px, 92vw);
      background: #14141c;
      color: #fff;
      outline: none;
      font-family: 'Open Sans', sans-serif;
      transition: border-color .2s, box-shadow .2s;
    }
    #searchInput::placeholder { color: #4a4a58; }
    #searchInput:focus { border-color: #6c7cff; box-shadow: 0 0 0 3px rgba(108,124,255,0.18); }

    /* Letter sections */
    #sections-container { margin-top: 8px; }
    .letter-section { margin-bottom: 28px; }
    .letter-header {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #444;
      padding: 6px 0 10px;
      border-bottom: 1px solid #1c1c28;
      margin-bottom: 12px;
    }
    .buttons-grid { display: flex; flex-wrap: wrap; gap: 8px; }

    input[type="button"] {
      padding: 9px 16px;
      background: #14141c;
      color: #d0d0e0;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Open Sans', sans-serif;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap;
    }
    input[type="button"]:hover { background: #1e1e2e; border-color: #6c7cff; color: #fff; }
    input[type="button"]:active { background: #252535; }

    .letter-section.hidden { display: none; }
100% { background-position: -200% 0; } }
  
    #site-footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      z-index: 50;
      text-align: center;
      padding: 8px 0;
      font-size: 12px;
      color: #555;
      background: #0a0a0f;
      border-top: 1px solid #1c1c28;
      pointer-events: none;
    }
    #tab-content-area { bottom: 32px !important; }
</style>

  <script>
    (function () {
      function desired() {
        try {
          var c = JSON.parse(localStorage.getItem('dizzy_cloak_v1') || '{}');

        } catch (e) { return 'Dizzy'; }
      }
      document.title = desired();
      setInterval(function () {
        var d = desired();
        if (document.title !== d) document.title = d;
      }, 1500);
    })();

  <!-- UGS game scripts -->
  
  <script>
  // Open UGS games inside Dizzy tabs (works on mobile; no popup)
  (function () {
    var CDN_BASES = [
      "vendor/games/", // local mirror if present
      "https://cdn.statically.io/gh/bubbls/ugs-singlefile/main/UGS-Files/",
      "https://raw.githack.com/bubbls/ugs-singlefile/main/UGS-Files/",
      "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/",
      "https://gitmirror.com/cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/"
    ];

    function gameTitle(name) {
      var n = String(name || "Game");
      if (n.indexOf("cl") === 0) n = n.slice(2);
      return n.replace(/([a-z])([A-Z])/g, "$1 $2") || "Game";
    }

    function normalizeFileName(name) {
      if (name.includes(".") && name.lastIndexOf(".") > 0) return name;
      return name + ".html";
    }

    function mobileFitHtml(html) {
      var inject =
        '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">' +
        "<style id=\"dizzy-mobile-fit\">" +
        "html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#000!important;}" +
        "body{display:flex!important;align-items:center!important;justify-content:center!important;}" +
        "canvas,#c2canvas,#c2canvasdiv,#game,#gameContainer,#unity-canvas,iframe,embed,object{" +
        "max-width:100vw!important;max-height:100vh!important;width:100%!important;height:auto!important;" +
        "object-fit:contain!important;touch-action:none;}" +
        "#c2canvasdiv{width:100%!important;height:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;}" +
        "</style>";
      if (/<head[^>]*>/i.test(html)) {
        html = html.replace(/<head[^>]*>/i, function (m) { return m + inject; });
      } else {
        html = inject + html;
      }
      // strip meta viewport that forces huge fixed widths
      html = html.replace(/<meta[^>]+name=["']viewport["'][^>]*>/gi, "");
      // re-add ours at top of head if we stripped all
      if (/<head[^>]*>/i.test(html) && html.indexOf("dizzy-mobile-fit") === -1) {
        html = html.replace(/<head[^>]*>/i, function (m) { return m + inject; });
      }
      return html;
    }

    async function fetchGameHtml(fileName) {
      var encoded = encodeURIComponent(normalizeFileName(fileName));
      // local first without encode path issues
      var names = [normalizeFileName(fileName), fileName];
      for (var i = 0; i < CDN_BASES.length; i++) {
        var base = CDN_BASES[i];
        for (var n = 0; n < names.length; n++) {
          var url = base + (base.indexOf("http") === 0 ? encodeURIComponent(names[n]) : names[n]) + (base.indexOf("http") === 0 ? ("?t=" + Date.now()) : "");
          try {
            var res = await fetch(url, { cache: "no-store" });
            if (!res.ok) continue;
            var text = await res.text();
            if (text && text.length > 80 && /html|canvas|script/i.test(text)) return text;
          } catch (e) {}
        }
      }
      return null;
    }

    window.dizzyOpenGameHtml = function (html, title) {
      html = mobileFitHtml(html);
      var blob = new Blob([html], { type: "text/html" });
      var blobUrl = URL.createObjectURL(blob);
      if (window.BrowserTabs && typeof BrowserTabs.openTab === "function") {
        BrowserTabs.openTab(blobUrl, gameTitle(title));
      } else {
        location.href = blobUrl;
      }
    };

    window.dizzyOpenGame = async function (fileName, title) {
      var label = gameTitle(title || fileName);
      // show loading tab immediately if possible
      var html = await fetchGameHtml(fileName);
      if (!html) {
        alert("Could not load game. CDNs may be blocked on this network.");
        return;
      }
      window.dizzyOpenGameHtml(html, label);
    };

    // Capture clicks on game buttons (mobile-safe)
    document.addEventListener("click", function (e) {
      var el = e.target;
      if (!el) return;
      if (el.tagName !== "INPUT" || el.type !== "button") {
        el = el.closest && el.closest('input[type="button"]');
      }
      if (!el || el.tagName !== "INPUT") return;
      // only game buttons inside sections
      if (!el.closest || !el.closest("#sections-container") && !el.closest(".buttons-container") && !el.closest(".buttons-grid")) {
        // still allow if value looks like game
      }
      var file = el.dataset.file || el.value || "";
      if (!file) return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      dizzyOpenGame(file, file);
      return false;
    }, true);
  })();
  </script>

  <script defer>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.BrowserTabs) BrowserTabs.init({ homeLabel: 'Games' });

      // Only clean "cl" prefix — do NOT block UGS game opens
      function stripCl(el) {
        if (!el || el.tagName !== 'INPUT' || el.type !== 'button') return;
        var v = el.value || '';
        if (v.indexOf('cl') === 0) el.value = v.slice(2);
      }
      document.querySelectorAll('input[type="button"]').forEach(stripCl);
      var obs = new MutationObserver(function(muts) {
        muts.forEach(function(m) {
          m.addedNodes.forEach(function(node) {
            if (node.nodeType !== 1) return;
            if (node.tagName === 'INPUT') stripCl(node);
            if (node.querySelectorAll) node.querySelectorAll('input[type="button"]').forEach(stripCl);
          });
        });
      });
      obs.observe(document.body, { childList: true, subtree: true });

      var searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function() {
          var q = searchInput.value.trim().toLowerCase();
          document.querySelectorAll('#sections-container input[type="button"]').forEach(function(btn) {
            btn.style.display = (!q || (btn.value || '').toLowerCase().includes(q)) ? '' : 'none';
          });
          document.querySelectorAll('.letter-section').forEach(function(sec) {
            var vis = sec.querySelectorAll('input[type="button"]:not([style*="display: none"])').length;
            sec.classList.toggle('hidden', vis === 0);
          });
        });
      }
});
  </script>

  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <script>
  (function () {
    var canvas = document.getElementById('particles-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var dots = [];
    var mouse = { x: -9999, y: -9999 };
    var colors = ['#8b7cf7', '#6c7cff', '#a78bfa', '#c4b5fd'];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var count = Math.min(70, Math.floor((canvas.width * canvas.height) / 18000));
      dots = [];
      for (var i = 0; i < count; i++) {
        dots.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          r: Math.random() * 2 + 0.8,
          c: colors[(Math.random() * colors.length) | 0],
          a: Math.random() * 0.4 + 0.28,
          tw: Math.random() * Math.PI * 2,
          tws: 0.02 + Math.random() * 0.04
        });
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', function (e) {
      mouse.x = e.clientX; mouse.y = e.clientY;
    });
    resize();

    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < dots.length; i++) {
        var p = dots[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        for (var j = i + 1; j < dots.length; j++) {
          var q = dots[j];
          var dx = p.x - q.x, dy = p.y - q.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < 140) {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(108,124,255,' + (0.32 * (1 - d / 140)).toFixed(3) + ')';
            ctx.lineWidth = 1;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
        var mdx = mouse.x - p.x, mdy = mouse.y - p.y;
        var md = Math.sqrt(mdx * mdx + mdy * mdy);
        if (md < 140) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(167,139,250,' + (0.38 * (1 - md / 150)).toFixed(3) + ')';
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
        p.tw += p.tws || 0.03;
        var twinkle = 0.55 + 0.45 * Math.sin(p.tw || 0);
        // occasional stronger pulse
        if (((Math.sin(p.tw * 0.35) + 1) * 0.5) > 0.97) twinkle = 1;
        ctx.beginPath();
        ctx.fillStyle = p.c;
        ctx.globalAlpha = Math.min(1, (p.a || 0.3) * twinkle);
        ctx.arc(p.x, p.y, p.r * (0.85 + 0.25 * twinkle), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
