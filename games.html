<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dizzy | Games</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #0a0a0f;
      color: #f2f2f7;
      font-family: 'Open Sans', system-ui, sans-serif;
      min-height: 100%;
    }

    /* ── Nav ── */
    .nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 18px 20px 0;
      border-bottom: 1px solid #1c1c28;
      background: #0a0a0f;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav a {
      text-decoration: none;
      color: #888;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 8px 8px 0 0;
      border: 1px solid transparent;
      border-bottom: none;
      transition: color .15s, background .15s;
    }
    .nav a:hover { color: #fff; background: #14141c; }
    .nav a.active {
      color: #fff;
      background: #14141c;
      border-color: #2a2a35;
      border-bottom: 1px solid #0a0a0f;
      margin-bottom: -1px;
    }

    /* ── Search ── */
    #search-wrap {
      text-align: center;
      padding: 22px 20px 0;
    }
    #searchInput {
      padding: 12px 20px;
      border: 1px solid #2a2a35;
      border-radius: 10px;
      font-size: 14px;
      width: min(420px, 92vw);
      background: #14141c;
      color: #fff;
      outline: none;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    #searchInput::placeholder { color: #4a4a58; }
    #searchInput:focus {
      border-color: #6c7cff;
      box-shadow: 0 0 0 3px rgba(108,124,255,0.18);
    }

    /* ── Quick links circles ── */
    #quick-links {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 20px 20px 18px;
    }
    .quick-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      color: #888;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color .15s;
    }
    .quick-link:hover { color: #fff; }
    .quick-link:hover .quick-circle { border-color: #6c7cff; background: #1a1a2e; }
    .quick-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #14141c;
      border: 1px solid #2a2a35;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .15s, background .15s;
      overflow: hidden;
    }
    .quick-circle img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    /* ── Letter sections ── */
    #sections-container {
      padding: 8px 20px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .letter-section { margin-bottom: 32px; }
    .letter-header {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #444;
      padding: 6px 0 10px;
      border-bottom: 1px solid #1c1c28;
      margin-bottom: 12px;
    }
    .buttons-grid { display: flex; flex-wrap: wrap; gap: 8px; }

    input[type="button"] {
      padding: 9px 16px;
      background: #14141c;
      color: #d0d0e0;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap;
    }
    input[type="button"]:hover {
      background: #1e1e2e;
      border-color: #6c7cff;
      color: #fff;
    }
    input[type="button"]:active { background: #252535; }

    /* ── Footer — stays at very bottom of page content, not fixed ── */
    #footer {
      width: 100%;
      background: #0a0a0f;
      border-top: 1px solid #1c1c28;
      padding: 14px 0;
      text-align: center;
      font-size: 12px;
      color: #555;
    }
    #footer p { margin: 0; }

    .letter-section.hidden { display: none; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="games.html" class="active">Games</a>
  </nav>

  <div id="search-wrap">
    <input type="text" id="searchInput" placeholder="Search 2947 games…" autocomplete="off">
  </div>


  <div id="sections-container"></div>

  <div id="footer"><p>© 2026 Crown Games. All rights reserved.</p></div>

  <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/searchbut.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@latest/game.js"></script>

  <script>
    // ── Strip "cl" prefix UGS puts on game names ─────────────────────────────
    function fixLabel(el) {
      if (el.tagName === 'INPUT' && el.type === 'button') {
        let v = el.value || '';
        if (v.startsWith('cl')) el.value = v.slice(2);
      }
    }

    // Run on any already-present buttons
    document.querySelectorAll('input[type="button"]').forEach(fixLabel);

    // Watch for UGS injecting buttons dynamically
    const fixObs = new MutationObserver(muts => {
      for (const m of muts) {
        for (const node of m.addedNodes) {
          if (node.nodeType !== 1) continue;
          if (node.tagName === 'INPUT' && node.type === 'button') fixLabel(node);
          node.querySelectorAll && node.querySelectorAll('input[type="button"]').forEach(fixLabel);
        }
      }
    });
    fixObs.observe(document.body, { childList: true, subtree: true });

    // ── Live search filter ────────────────────────────────────────────────────
    const searchInput = document.getElementById('searchInput');

    function filterGames() {
      const q = searchInput.value.trim().toLowerCase();
      document.querySelectorAll('#sections-container input[type="button"]').forEach(btn => {
        const match = !q || (btn.value || '').toLowerCase().includes(q);
        btn.style.display = match ? '' : 'none';
      });
      document.querySelectorAll('.letter-section').forEach(sec => {
        const visible = sec.querySelectorAll('input[type="button"]:not([style*="display: none"])').length;
        sec.classList.toggle('hidden', visible === 0);
      });
    }

    searchInput.addEventListener('input', filterGames);

    const searchObs = new MutationObserver(() => {
      if (searchInput.value) filterGames();
    });
    searchObs.observe(document.getElementById('sections-container'), { childList: true, subtree: true });
  </script>

</body>
</html>
