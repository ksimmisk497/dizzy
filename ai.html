<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dizzy</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="browser.css">

<script>
(function () {
  var embed = /(?:\?|&)embed=1(?:&|$)/.test(location.search) || window !== window.top;
  if (embed) document.documentElement.classList.add("dizzy-embed");
})();
</script>

<style id="full-bleed-fix">
html,body{width:100%!important;height:100%!important;overflow:hidden!important}
#tab-content-area{position:fixed!important;top:var(--chrome-h)!important;left:var(--rail)!important;right:0!important;bottom:0!important}
#home-frame{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}
#home-frame.active{display:block!important}
.ai-shell{position:absolute;inset:0;display:flex;flex-direction:column;background:#050208}
.ai-top{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(155,92,255,.35);background:#0a0612}
.ai-top img{width:28px;height:28px;border-radius:8px}
.ai-top h1{margin:0;font-size:14px;font-weight:700;color:#f5eaff}
.ai-top span{color:#b89ad4;font-size:11px;margin-left:auto}
.ai-frame{flex:1;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<nav class="rail" aria-label="Main">
<img class="rail-logo" src="favicon.png" alt="Dizzy">
<a href="index.html" data-label="Home"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg></a>
<a href="games.html" data-label="Games"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="3"/><path d="M8 12h2M7 10v4M16 11h.01M18 13h.01"/></svg></a>
<a href="apps.html" data-label="Apps"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></a>
<a href="ai.html" class="active" data-label="AI"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M16.3 7.7l2.1-2.1M5.6 18.4l2.1-2.1"/><circle cx="12" cy="12" r="3.5"/></svg></a>
<a href="settings.html" data-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></a>
<div class="rail-spacer"></div></nav>

<div id="browser-chrome">
  <div id="tab-bar">
    <div class="tab active" id="home-tab" onclick="BrowserTabs.switchTab('home')">
      <img class="tab-favicon" src="favicon.png" onerror="this.style.display='none'">
      <span class="tab-title">Dizzy AI</span>
    </div>
    <button id="new-tab-btn" onclick="BrowserTabs.openTab(null)" title="New Tab">+</button>
  </div>
  <div id="address-bar-row">
    <button class="nav-btn" id="btn-back" onclick="BrowserTabs.tabBack()">&#8592;</button>
    <button class="nav-btn" id="btn-forward" onclick="BrowserTabs.tabForward()">&#8594;</button>
    <button class="nav-btn" id="btn-reload" onclick="BrowserTabs.tabReload()">&#8635;</button>
    <input id="address-input" class="home-tab" type="text" value="Dizzy AI" autocomplete="off"
           onfocus="BrowserTabs.addressFocus()" onblur="BrowserTabs.addressBlur()"
           onkeydown="if(event.key==='Enter')BrowserTabs.addressGo()">
  </div>
</div>

<div id="tab-content-area">
  <div id="home-frame" class="active">
    <div class="ai-shell">
      <div class="ai-top">
        <img src="favicon.png" alt="">
        <h1>Dizzy AI</h1>
        <span>chat</span>
      </div>
      <iframe class="ai-frame" id="ai-frame" title="Dizzy AI" allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </div>
</div>

<script src="uv/uv.bundle.js" defer></script>
<script src="uv/uv.config.js" defer></script>
<script src="register-sw.js" defer></script>
<script src="search.js" defer></script>
<script src="browser.js"></script>
<script src="cloak.js"></script>
<script src="browser-ua.js"></script>
<script src="teacher-watch.js"></script>

<script>
(function () {
  if (window.BrowserTabs) try { BrowserTabs.init({ homeLabel: "Dizzy AI" }); } catch (e) {}
  var AI_URL = "https://ask-chat.ai";
  function proxied(url) {
    try {
      if (typeof __uv$config !== "undefined" && __uv$config.prefix && __uv$config.encodeUrl) {
        return location.origin + __uv$config.prefix + __uv$config.encodeUrl(url);
      }
    } catch (e) {}
    return url;
  }
  var frame = document.getElementById("ai-frame");
  if (frame) frame.src = proxied(AI_URL);
})();
</script>
</body>
</html>
