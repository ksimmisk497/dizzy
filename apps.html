<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dizzy</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="browser.css">
<script>
(function () {
  var embed = /(?:\?|&)embed=1(?:&|$)/.test(location.search) || window !== window.top;
  if (embed) document.documentElement.classList.add("dizzy-embed");
})();
</script>
<style>
html,body{width:100%!important;height:100%!important;overflow:hidden!important}
#tab-content-area{position:fixed!important;top:var(--chrome-h)!important;left:var(--rail)!important;right:0!important;bottom:0!important}
#home-frame{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;overflow:auto}
#home-frame.active{display:block!important}
.apps-content{min-height:100%;padding:18px 16px 1px;background:transparent}
.search-container{display:flex;justify-content:center;padding:4px 12px 0}
#searchBar{width:100%;max-width:400px;padding:12px 20px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.3);backdrop-filter:blur(5px);color:var(--ink);font:14px var(--font);outline:none;transition:.2s}
#searchBar:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--wash)}
#searchBar::placeholder{color:var(--faint)}
.favorite-filter{display:flex;align-items:center;gap:9px;width:max-content;margin:14px 15px 0;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
#showFavorites{width:15px;height:15px;margin:0;accent-color:var(--acc)}
.game-buttons-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:25px;padding:30px 20px;max-width:1400px;margin:40px auto 0}
.game-button{width:200px;height:250px;padding:15px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;transform-origin:center;transition:transform .25s ease}
.game-button:hover{transform:scale(1.04)}
.app-open{width:200px;height:200px;padding:0;border:0;border-radius:25px;background:transparent;cursor:pointer;outline:none}
.app-open:focus-visible{box-shadow:0 0 0 3px var(--acc2)}
.app-open img{display:block;width:200px;height:200px;object-fit:cover;border:0;border-radius:25px;background:var(--raise);filter:drop-shadow(0 0 0 transparent);transition:transform .25s ease,filter .3s ease}
.game-button:hover .app-open img{filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.game-title{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin:12px 0 0;color:var(--ink);font-size:14px;font-weight:600;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.favorite-icon{width:24px;height:24px;flex:none;display:grid;place-items:center;padding:2px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:transform .2s,color .2s}
.favorite-icon:hover{transform:scale(1.15);color:var(--acc2)}
.favorite-icon.active{color:var(--acc2)}
.favorite-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.favorite-icon.active svg{fill:currentColor}
.pagination{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:40px 0 60px;padding:0 20px}
.pagination button{min-width:40px;height:40px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:rgba(0,0,0,.3);backdrop-filter:blur(5px);color:var(--ink);font:600 14px var(--font);cursor:pointer;transition:.2s}
.pagination button:hover:not(.active-page){border-color:var(--line2);background:var(--wash2)}
.pagination button.active-page{border-color:var(--acc);background:var(--wash2);color:var(--acc2)}
.apps-message{grid-column:1/-1;margin:0;padding:24px 10px;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:520px){.game-buttons-container{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:24px 8px}.game-button{margin:0 auto}}
</style>
</head>
<body>
<nav class="rail" aria-label="Main">
  <img class="rail-logo" src="favicon.png" alt="Dizzy">
  <a href="index.html" data-label="Home"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg></a>
  <a href="games.html" data-label="Games"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="3"/><path d="M8 12h2M7 10v4M16 11h.01M18 13h.01"/></svg></a>
  <a href="apps.html" class="active" data-label="Apps"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></a>
  <a href="settings.html" data-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></a>
  <div class="rail-spacer"></div>
</nav>

<div id="browser-chrome">
  <div id="tab-bar">
    <div class="tab active" id="home-tab" onclick="BrowserTabs.switchTab('home')">
      <img class="tab-favicon" src="favicon.png" onerror="this.style.display='none'">
      <span class="tab-title">Apps</span>
    </div>
    <button id="new-tab-btn" onclick="BrowserTabs.openTab(null)" title="New Tab">+</button>
  </div>
  <div id="address-bar-row">
    <button class="nav-btn" id="btn-back" onclick="BrowserTabs.tabBack()">&#8592;</button>
    <button class="nav-btn" id="btn-forward" onclick="BrowserTabs.tabForward()">&#8594;</button>
    <button class="nav-btn" id="btn-reload" onclick="BrowserTabs.tabReload()">&#8635;</button>
    <input id="address-input" class="home-tab" type="text" value="Apps" autocomplete="off"
           onfocus="BrowserTabs.addressFocus()" onblur="BrowserTabs.addressBlur()"
           onkeydown="if(event.key==='Enter')BrowserTabs.addressGo()">
  </div>
</div>

<div id="tab-content-area">
  <div id="home-frame" class="active">
    <main class="apps-content">
      <div class="search-container"><input type="search" id="searchBar" placeholder="Search games..." autocomplete="off" aria-label="Search apps"></div>
      <label class="favorite-filter"><input type="checkbox" id="showFavorites"> Show Favorites Only</label>
      <div id="gameButtons" class="game-buttons-container"></div>
      <div class="pagination" id="paginationControls"></div>
    </main>
  </div>
</div>

<script src="uv/uv.bundle.js" defer></script>
<script src="uv/uv.config.js" defer></script>
<script src="register-sw.js" defer></script>
<script src="search.js" defer></script>
<script src="browser.js"></script>
<script src="cloak.js"></script>
<script src="browser-ua.js"></script>
<script>
if (window.BrowserTabs) try { BrowserTabs.init({ homeLabel: "Apps" }); } catch (e) {}
(function () {
  var appsData = [];
  var filteredApps = [];
  var currentPage = 1;
  var pageSize = 48;
  var grid = document.getElementById("gameButtons");
  var searchBar = document.getElementById("searchBar");
  var showFavorites = document.getElementById("showFavorites");
  var pagination = document.getElementById("paginationControls");
  var favorites = [];

  try {
    var saved = JSON.parse(localStorage.getItem("favorites") || "[]");
    if (Array.isArray(saved)) favorites = saved;
  } catch (e) {}

  function currentTabs() {
    if (window.BrowserTabs && typeof window.BrowserTabs.openTab === "function") return window.BrowserTabs;
    if (window.parent && window.parent.BrowserTabs && typeof window.parent.BrowserTabs.openTab === "function") return window.parent.BrowserTabs;
    return null;
  }

  function openInDizzy(url, title) {
    var tabs = currentTabs();
    if (tabs) tabs.openTab(url, title);
    else window.open(url, "_blank");
  }

  async function openApp(app) {
    try {
      var response = await fetch(app.url, { cache: "no-store" });
      if (!response.ok) throw new Error(String(response.status));
      var content = await response.text();
      var base = '<base href="' + new URL(".", app.url).href.replace(/"/g, "&quot;") + '">';
      if (/<head[^>]*>/i.test(content)) content = content.replace(/<head([^>]*)>/i, function (head) { return head + base; });
      else content = "<head>" + base + "</head>" + content;
      var blobUrl = URL.createObjectURL(new Blob([content], { type: "text/html;charset=utf-8" }));
      openInDizzy(blobUrl, app.title);
    } catch (e) {
      openInDizzy(app.url, app.title);
    }
  }

  function toggleFavorite(app, button) {
    var index = favorites.indexOf(app.title);
    if (index === -1) favorites.push(app.title);
    else favorites.splice(index, 1);
    try { localStorage.setItem("favorites", JSON.stringify(favorites)); } catch (e) {}
    button.classList.toggle("active", favorites.indexOf(app.title) !== -1);
    button.setAttribute("aria-pressed", favorites.indexOf(app.title) !== -1 ? "true" : "false");
    if (showFavorites.checked) applyFilters();
  }

  function renderPage() {
    grid.textContent = "";
    var start = (currentPage - 1) * pageSize;
    var visible = filteredApps.slice(start, start + pageSize);
    if (!visible.length) {
      var message = document.createElement("p");
      message.className = "apps-message";
      message.textContent = appsData.length ? "No apps found." : "Failed to load apps. Please try again.";
      grid.appendChild(message);
      pagination.textContent = "";
      return;
    }
    visible.forEach(function (app) {
      var card = document.createElement("article");
      card.className = "game-button";
      var launch = document.createElement("button");
      launch.type = "button";
      launch.className = "app-open";
      launch.setAttribute("aria-label", app.title);
      var image = document.createElement("img");
      image.src = app.image;
      image.alt = app.title;
      image.loading = "lazy";
      image.onerror = function () { image.style.visibility = "hidden"; };
      launch.appendChild(image);
      launch.addEventListener("click", function () { openApp(app); });
      var caption = document.createElement("p");
      caption.className = "game-title";
      var name = document.createElement("span");
      name.textContent = app.title;
      var favorite = document.createElement("button");
      favorite.type = "button";
      favorite.className = "favorite-icon" + (favorites.indexOf(app.title) !== -1 ? " active" : "");
      favorite.setAttribute("aria-label", favorites.indexOf(app.title) !== -1 ? "Remove " + app.title + " from favorites" : "Add " + app.title + " to favorites");
      favorite.setAttribute("aria-pressed", favorites.indexOf(app.title) !== -1 ? "true" : "false");
      favorite.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.85 5.78 6.38.93-4.62 4.5 1.09 6.36L12 17.37l-5.7 3 1.09-6.36-4.62-4.5 6.38-.93L12 2.8z"/></svg>';
      favorite.addEventListener("click", function () { toggleFavorite(app, favorite); });
      caption.appendChild(name);
      caption.appendChild(favorite);
      card.appendChild(launch);
      card.appendChild(caption);
      grid.appendChild(card);
    });
    renderPagination();
  }

  function renderPagination() {
    pagination.textContent = "";
    var pages = Math.ceil(filteredApps.length / pageSize);
    for (var page = 1; page <= pages; page++) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = String(page);
      if (page === currentPage) button.className = "active-page";
      button.addEventListener("click", function (selectedPage) {
        return function () {
          currentPage = selectedPage;
          renderPage();
          document.getElementById("home-frame").scrollTo({ top: 0, behavior: "smooth" });
        };
      }(page));
      pagination.appendChild(button);
    }
  }

  function applyFilters() {
    var query = searchBar.value.toLowerCase().trim();
    filteredApps = appsData.filter(function (app) {
      var matchesSearch = app.title.toLowerCase().includes(query);
      var matchesFavorite = !showFavorites.checked || favorites.indexOf(app.title) !== -1;
      return matchesSearch && matchesFavorite;
    });
    currentPage = 1;
    renderPage();
  }

  searchBar.addEventListener("input", applyFilters);
  showFavorites.addEventListener("change", applyFilters);

  fetch("apps/catalog.json", { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error(String(response.status));
      return response.json();
    })
    .then(function (data) {
      appsData = Array.isArray(data) ? data : [];
      filteredApps = appsData.slice();
      renderPage();
    })
    .catch(function () { renderPage(); });
})();
</script>
<script src="teacher-watch.js"></script>
<script src="notifications.js"></script>
</body>
</html>
