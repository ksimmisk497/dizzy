<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dizzy</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="fonts/local.css">
<link rel="stylesheet" href="browser.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #0a0a0f;
  --bg2:    #0f0f18;
  --bg3:    #14141f;
  --border: rgba(108,124,255,.15);
  --accent: #6c7cff;
  --accent2:#a78bfa;
  --text:   #e8e8f0;
  --muted:  #6060a0;
  --radius: 10px;
}

html, body {
  height: 100%; background: var(--bg);
  color: var(--text);
  font-family: 'Open Sans', system-ui, sans-serif;
  overflow-x: hidden;
}

/* ambient blobs matching Dizzy */
.ambient-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--bg); }
.ambient-blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
.ambient-blob.a {
  width: min(58vw,520px); height: min(58vw,520px); left: 6%; top: 10%;
  background: radial-gradient(circle at 40% 40%, rgba(120,90,220,.6) 0%, rgba(90,60,180,.3) 42%, transparent 70%);
  animation: dA 18s ease-in-out infinite alternate;
}
.ambient-blob.b {
  width: min(64vw,580px); height: min(64vw,580px); right: 4%; bottom: 4%;
  background: radial-gradient(circle at 55% 45%, rgba(150,80,210,.5) 0%, rgba(100,50,170,.25) 45%, transparent 72%);
  animation: dB 22s ease-in-out infinite alternate;
}
@keyframes dA { to { transform: translate(4%,3%) scale(1.08); } }
@keyframes dB { to { transform: translate(-5%,-2%) scale(.96); } }

/* ── Page structure ── */
#page {
  position: relative; z-index: 1;
  padding: 24px 20px 60px;
  max-width: 1400px;
  margin: 0 auto;
  min-height: 100vh;
}

/* ── Search bar ── */
#search-bar {
  display: flex; align-items: center; gap: 10px;
  background: rgba(20,20,32,.85); border: 1px solid var(--border);
  border-radius: 12px; padding: 0 16px; height: 44px;
  width: min(480px, 100%); margin: 0 auto 32px;
  transition: border-color .2s, box-shadow .2s;
}
#search-bar:focus-within {
  border-color: rgba(108,124,255,.5);
  box-shadow: 0 0 0 3px rgba(108,124,255,.12), 0 0 24px rgba(108,124,255,.12);
}
#search-bar input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-size: 14px; font-family: inherit;
}
#search-bar input::placeholder { color: var(--muted); }

/* ── Tab pills ── */
.pills {
  display: flex; gap: 6px; justify-content: center; margin-bottom: 28px;
}
.pill {
  padding: 7px 18px; border-radius: 20px; border: 1px solid var(--border);
  background: rgba(20,20,32,.6); color: var(--muted);
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all .15s;
}
.pill.active {
  background: rgba(108,124,255,.2); border-color: var(--accent);
  color: var(--text);
}
.pill:not(.active):hover { border-color: rgba(108,124,255,.35); color: var(--text); }

/* ── Section ── */
.section { margin-bottom: 36px; }
.section-title {
  font-size: 13px; font-weight: 700; letter-spacing: .5px;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 14px; padding-left: 2px;
}

/* ── Horizontal scroll row ── */
.row {
  display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px;
  scrollbar-width: thin; scrollbar-color: rgba(108,124,255,.2) transparent;
}
.row::-webkit-scrollbar { height: 3px; }
.row::-webkit-scrollbar-thumb { background: rgba(108,124,255,.2); border-radius: 2px; }

/* ── Card ── */
.card {
  flex-shrink: 0; width: 130px; border-radius: var(--radius);
  overflow: hidden; cursor: pointer;
  background: rgba(14,14,24,.95); border: 1px solid var(--border);
  transition: transform .18s, border-color .18s, box-shadow .18s;
  position: relative;
}
.card:hover {
  transform: translateY(-5px) scale(1.03);
  border-color: rgba(108,124,255,.5);
  box-shadow: 0 10px 36px rgba(108,124,255,.22);
}
.card-poster {
  width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block;
  background: var(--bg3);
}
.card-no-poster {
  width: 100%; aspect-ratio: 2/3;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; background: var(--bg3);
}
.card-body { padding: 8px 9px 10px; }
.card-name {
  font-size: 11.5px; font-weight: 600; color: var(--text);
  line-height: 1.35; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-year { font-size: 11px; color: var(--muted); margin-top: 3px; }
.card-score {
  position: absolute; top: 6px; right: 6px;
  background: rgba(0,0,0,.72); backdrop-filter: blur(4px);
  border-radius: 5px; padding: 2px 6px;
  font-size: 10.5px; font-weight: 700; color: #f5c518;
}
.card-type-badge {
  position: absolute; top: 6px; left: 6px;
  background: rgba(108,124,255,.75); border-radius: 4px;
  padding: 1px 5px; font-size: 9px; font-weight: 700;
  color: #fff; letter-spacing: .3px;
}

/* ── Grid view (search) ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px;
}
.grid .card { width: 100%; }

/* ── Skeleton ── */
.sk { border-radius: var(--radius); overflow: hidden; }
.sk-inner {
  background: linear-gradient(90deg, var(--bg3) 25%, rgba(30,30,50,.7) 50%, var(--bg3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.sk-poster { width: 100%; aspect-ratio: 2/3; }
.sk-line { height: 11px; margin: 8px 9px 4px; border-radius: 3px; }
.sk-line.s { width: 55%; margin-bottom: 10px; }

/* ── Server picker modal ── */
#server-modal {
  position: fixed; inset: 0; z-index: 900;
  background: rgba(5,5,10,.88); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
#server-modal.open { display: flex; }
.modal-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px 24px; width: min(420px, 100%);
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.modal-poster-row {
  display: flex; gap: 16px; align-items: flex-start; margin-bottom: 20px;
}
.modal-poster {
  width: 80px; flex-shrink: 0; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--border);
}
.modal-poster img { width: 100%; display: block; }
.modal-poster .no-img { width: 100%; aspect-ratio: 2/3; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 24px; }
.modal-info { flex: 1; min-width: 0; }
.modal-title { font-size: 16px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
.modal-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.modal-overview {
  font-size: 12px; color: var(--muted); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.modal-label {
  font-size: 11px; font-weight: 700; letter-spacing: .5px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 10px;
}
.server-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.srv {
  padding: 10px 14px; border-radius: 9px; border: 1px solid var(--border);
  background: rgba(20,20,32,.8); color: var(--text);
  font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 500;
  text-align: left; transition: all .15s;
  display: flex; align-items: center; gap: 8px;
}
.srv:hover { border-color: var(--accent); background: rgba(108,124,255,.12); }
.srv-dot { width: 7px; height: 7px; border-radius: 50%; background: #3c3; flex-shrink: 0; }
.srv-dot.y { background: #fa0; }
.modal-cancel {
  width: 100%; padding: 10px; border-radius: 9px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); font-size: 13px; font-family: inherit;
  cursor: pointer; transition: all .15s;
}
.modal-cancel:hover { border-color: rgba(108,124,255,.35); color: var(--text); }

/* TV season/ep selector inside modal */
.tv-selectors {
  display: none; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
}
.tv-selectors.show { display: flex; }
.tv-selectors label { font-size: 12px; color: var(--muted); align-self: center; }
.tv-selectors select {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 6px 10px;
  font-size: 12px; font-family: inherit; cursor: pointer; flex: 1; min-width: 0;
}

/* ── Empty / error ── */
.empty {
  display: flex; flex-direction: column; align-items: center;
  padding: 60px 20px; color: var(--muted); font-size: 13px;
  gap: 10px; text-align: center;
}
.empty .ico { font-size: 38px; }

.provider-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:rgba(20,20,32,.8);font-size:12px;font-weight:600}.provider-logo{width:28px;height:28px;border-radius:6px;overflow:hidden;display:grid;place-items:center;background:var(--bg3);flex-shrink:0}.provider-logo img{width:100%;height:100%;object-fit:cover}.provider-link{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text);grid-column:1/-1}.provider-empty,.provider-loading{grid-column:1/-1;color:var(--muted);font-size:12px;padding:8px 2px}
@media (max-width: 500px) {
  #page { padding: 18px 12px 60px; }
  .card { width: 110px; }
}
</style>
</head>

<script>
// ══════════════════════════════════════
// CONFIG
// ══════════════════════════════════════
const TMDB_KEY = '4ef0d7355d9ffb5151e987764708ce96';
const TMDB     = 'https://api.themoviedb.org/3';
const IMG      = 'https://image.tmdb.org/t/p/w300';

// Providers — 5 servers, alternating green/yellow dots
const REGION = 'US'; // TMDB watch-provider region

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let currentTab  = 'movie';
let currentItem = null;   // { id, type, title, year, overview, poster }
let searchTimer = null;

// ══════════════════════════════════════
// TMDB HELPER
// ══════════════════════════════════════
async function tmdb(path, extra = {}) {
  const u = new URL(`${TMDB}${path}`);
  u.searchParams.set('api_key', TMDB_KEY);
  Object.entries(extra).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// ══════════════════════════════════════
// TAB
// ══════════════════════════════════════
function setTab(tab) {
  currentTab = tab;
  document.getElementById('pill-movies').classList.toggle('active', tab === 'movie');
  document.getElementById('pill-tv').classList.toggle('active', tab === 'tv');
  document.getElementById('q').value = '';
  showHome();
  loadHome();
}

function showHome() {
  document.getElementById('home-sections').style.display = '';
  document.getElementById('search-results').style.display = 'none';
}
function showSearch() {
  document.getElementById('home-sections').style.display = 'none';
  document.getElementById('search-results').style.display = '';
}

// ══════════════════════════════════════
// SKELETON
// ══════════════════════════════════════
function skRow(n=10) {
  return `<div class="row">${Array.from({length:n},()=>`
    <div class="sk card" style="width:130px">
      <div class="sk-inner sk-poster"></div>
      <div style="padding:8px 9px 10px">
        <div class="sk-inner sk-line"></div>
        <div class="sk-inner sk-line s"></div>
      </div>
    </div>`).join('')}</div>`;
}

// ══════════════════════════════════════
// CARD RENDER
// ══════════════════════════════════════
function cardHTML(item, type) {
  const isTV  = type === 'tv';
  const title = isTV ? (item.name||'') : (item.title||'');
  const year  = ((isTV ? item.first_air_date : item.release_date)||'').slice(0,4);
  const score = item.vote_average ? `<div class="card-score">★ ${item.vote_average.toFixed(1)}</div>` : '';
  const poster = item.poster_path
    ? `<img class="card-poster" src="${IMG}${item.poster_path}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    + `<div class="card-no-poster" style="display:none">🎬</div>`
    : `<div class="card-no-poster">🎬</div>`;
  const badge = type === 'tv' ? `<div class="card-type-badge">TV</div>` : '';
  const data  = JSON.stringify({id:item.id, type, title, year, overview:item.overview||'', poster:item.poster_path||''});
  return `<div class="card" onclick='pickServer(${data})'>${score}${badge}${poster}<div class="card-body"><div class="card-name">${title}</div>${year?`<div class="card-year">${year}</div>`:''}</div></div>`;
}

// ══════════════════════════════════════
// HOME
// ══════════════════════════════════════
async function loadHome() {
  const isTV = currentTab === 'tv';
  const sections = isTV
    ? [
        ['Trending Today', `/trending/tv/day`], ['Popular TV', `/tv/popular`],
        ['Top Rated TV', `/tv/top_rated`], ['Airing Today', `/tv/airing_today`],
        ['On the Air', `/tv/on_the_air`]
      ]
    : [
        ['Trending Today', `/trending/movie/day`], ['Popular Movies', `/movie/popular`],
        ['Top Rated Movies', `/movie/top_rated`], ['Now Playing', `/movie/now_playing`],
        ['Coming Soon', `/movie/upcoming`], ['Action', `/discover/movie`],
        ['Comedy', `/discover/movie`], ['Horror', `/discover/movie`]
      ];

  const wrap = document.getElementById('home-sections');
  wrap.innerHTML = sections.map(([label, path], i) => `
    <div class="section">
      <div class="section-title">${label}</div>
      ${skRow()}
    </div>`).join('');

  // fetch in parallel
  const sectionParams = [{},{},{},{},{},
    {with_genres:'28',sort_by:'popularity.desc'},
    {with_genres:'35',sort_by:'popularity.desc'},
    {with_genres:'27',sort_by:'popularity.desc'}];

  sections.forEach(([label, path], i) => {
    tmdb(path, {page:1, ...(sectionParams[i] || {})}).then(data => {
      const rows = wrap.querySelectorAll('.section');
      if (!rows[i]) return;
      const items = (data.results||[]).slice(0,20);
      rows[i].querySelector('.row').innerHTML = items.map(item => cardHTML(item, currentTab === 'tv' ? 'tv' : 'movie')).join('');
    }).catch(() => {});
  });
}

// ══════════════════════════════════════
// SEARCH
// ══════════════════════════════════════
async function doSearch(q) {
  if (!q.trim()) { showHome(); return; }
  showSearch();
  const wrap = document.getElementById('search-results');
  wrap.innerHTML = `<div class="section"><div class="section-title">Results for "${q}"</div><div class="grid">${Array.from({length:12},()=>`<div class="sk card"><div class="sk-inner sk-poster"></div><div style="padding:8px 9px 10px"><div class="sk-inner sk-line"></div></div></div>`).join('')}</div></div>`;
  try {
    const type = currentTab === 'tv' ? 'tv' : 'movie';
    const data = await tmdb(`/search/multi`, {query: q, page: 1});
    const results = (data.results||[]).filter(r => r.media_type === 'movie' || r.media_type === 'tv').slice(0,40);
    wrap.innerHTML = `<div class="section"><div class="section-title">Results for "${q}"</div><div class="grid">${
      results.length
        ? results.map(r => cardHTML(r, r.media_type)).join('')
        : '<div class="empty" style="grid-column:1/-1"><span class="ico">🔍</span>No results</div>'
    }</div></div>`;
  } catch(e) {
    wrap.innerHTML = `<div class="empty"><span class="ico">⚠️</span>Search failed — try again</div>`;
  }
}

// ══════════════════════════════════════
// SERVER PICKER MODAL
// ══════════════════════════════════════
function pickServer(item) {
  currentItem = item;
  document.getElementById('modal-title').textContent    = item.title;
  document.getElementById('modal-meta').textContent     = item.year || '';
  document.getElementById('modal-overview').textContent = item.overview || '';

  const posterWrap = document.getElementById('modal-poster-wrap');
  posterWrap.innerHTML = item.poster
    ? `<img src="${IMG}${item.poster}" alt="" style="width:100%;display:block;border-radius:8px">`
    : `<div class="no-img">🎬</div>`;

  // TV selectors
  const tvWrap = document.getElementById('tv-sel-wrap');
  if (item.type === 'tv') {
    tvWrap.classList.add('show');
    loadTVSeasons(item.id);
  } else {
    tvWrap.classList.remove('show');
  }

  document.getElementById('server-grid').innerHTML =
    `<div class="provider-loading">Finding official watch options…</div>`;
  loadWatchProviders(item);

  document.getElementById('server-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('server-modal').classList.remove('open');
}

async function loadTVSeasons(id) {
  try {
    const data    = await tmdb(`/tv/${id}`);
    const seasons = (data.seasons||[]).filter(s => s.season_number > 0);
    const sel     = document.getElementById('season-sel');
    sel.innerHTML = seasons.map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('');
    await loadEpisodeList(id, 1);
  } catch(e) {}
}

async function loadEpisodeList(id, season) {
  try {
    const data = await tmdb(`/tv/${id}/season/${season}`);
    const sel  = document.getElementById('ep-sel');
    sel.innerHTML = (data.episodes||[]).map(e =>
      `<option value="${e.episode_number}">Ep ${e.episode_number}: ${e.name}</option>`
    ).join('');
  } catch(e) {}
}

async function onSeasonChange() {
  const s = parseInt(document.getElementById('season-sel').value) || 1;
  if (currentItem) await loadEpisodeList(currentItem.id, s);
}

// ══════════════════════════════════════
async function loadWatchProviders(item) {
  const grid = document.getElementById('server-grid');
  try {
    const data = await tmdb(`/${item.type}/${item.id}/watch/providers`);
    const region = data.results?.[REGION];
    const groups = [...(region?.flatrate||[]), ...(region?.free||[]), ...(region?.ads||[]), ...(region?.rent||[]), ...(region?.buy||[])];
    const seen = new Set(), providers = groups.filter(p => !seen.has(p.provider_id) && seen.add(p.provider_id));
    if (!providers.length) {
      grid.innerHTML = region?.link
        ? `<a class="srv provider-link" href="${region.link}" target="_blank" rel="noopener noreferrer">🔎 View legal watch options</a>`
        : `<div class="provider-empty">No U.S. watch options were listed by TMDB.</div>`;
      return;
    }
    grid.innerHTML = providers.slice(0,12).map(p => {
      const logo = p.logo_path ? `<img src="${IMG}${p.logo_path}" alt="">` : '▶';
      return `<div class="provider-card"><span class="provider-logo">${logo}</span><span>${escapeHTML(p.provider_name)}</span></div>`;
    }).join('');
    if (region?.link) grid.innerHTML += `<a class="srv provider-link" href="${region.link}" target="_blank" rel="noopener noreferrer">🔎 Open all legal watch options</a>`;
  } catch(e) {
    grid.innerHTML = `<div class="provider-empty">Watch options couldn't be loaded.</div>`;
  }
}
function escapeHTML(value) {
  return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ══════════════════════════════════════
// SEARCH WIRE-UP
// ══════════════════════════════════════
document.getElementById('q').addEventListener('input', function() {
  clearTimeout(searchTimer);
  const v = this.value.trim();
  if (!v) { showHome(); return; }
  searchTimer = setTimeout(() => doSearch(v), 380);
});
document.getElementById('q').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(this.value.trim()); }
});

// Close modal on backdrop click
document.getElementById('server-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ══════════════════════════════════════
// BOOT
// ══════════════════════════════════════
loadHome();
</script>
