<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dizzy</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="browser.css">
  <script src="cloak.js"></script>
  <style>
    #settings-inner {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 20px 90px;
      font-family: 'Open Sans', system-ui, sans-serif;
      color: #e8e8ff;
    }
    .s-card {
      background: rgba(20,20,28,0.92);
      border: 1px solid #2a2a35;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .s-card h3 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #a8a8bc;
      font-weight: 600;
    }
    .s-row { margin-bottom: 12px; }
    .s-row label {
      display: block;
      font-size: 12px;
      color: #9a9aac;
      margin-bottom: 6px;
    }
    .s-row input, .s-row select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2a2a35;
      background: #12121a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .s-row input:focus, .s-row select:focus {
      border-color: rgba(108,124,255,0.6);
    }
    .s-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .s-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(108,124,255,0.35);
      background: rgba(108,124,255,0.16);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .s-btn:hover { background: rgba(108,124,255,0.28); }
    .s-btn.ghost {
      background: transparent;
      border-color: #2a2a35;
      color: #bbb;
    }

    .browser-card {
      background: linear-gradient(145deg, rgba(20,20,30,.96), rgba(14,14,22,.96));
      border-color: rgba(130,110,255,.22);
      box-shadow: 0 14px 45px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.025);
    }
    .browser-card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
    .browser-card-head h3 { margin-bottom:6px; }
    .browser-current { flex:none; padding:6px 9px; border-radius:999px; background:rgba(130,100,255,.13); border:1px solid rgba(130,100,255,.25); color:#c8bfff; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; }
    .browser-list { display:grid; gap:8px; }
    .browser-option { width:100%; display:flex; align-items:center; gap:12px; padding:11px; border:1px solid #292936; border-radius:12px; background:rgba(12,12,18,.72); color:#fff; text-align:left; cursor:pointer; transition:transform .16s, border-color .16s, background .16s, box-shadow .16s; }
    .browser-option:hover { transform:translateY(-1px); border-color:rgba(130,110,255,.48); background:rgba(25,23,38,.9); }
    .browser-option.selected { border-color:rgba(139,124,247,.72); background:linear-gradient(90deg, rgba(110,85,220,.18), rgba(50,40,80,.18)); box-shadow:0 0 0 1px rgba(139,124,247,.08), 0 8px 24px rgba(65,45,140,.12); }
    .browser-icon { width:36px; height:36px; flex:none; display:grid; place-items:center; border-radius:10px; font-size:17px; font-weight:800; background:#20202b; border:1px solid #343444; overflow:hidden; }
    .engine-logo { width:24px; height:24px; object-fit:contain; display:block; }
    .dizzy-icon { background:linear-gradient(135deg,#201536,#12121c); border-color:rgba(139,124,247,.45); box-shadow:inset 0 0 18px rgba(139,124,247,.08); }
    .dizzy-icon .engine-logo { width:27px; height:27px; filter:drop-shadow(0 0 7px rgba(167,139,250,.45)); }
    .browser-option-copy { min-width:0; display:flex; align-items:center; flex:1; }
    .browser-option-copy strong { font-size:13px; font-weight:600; }
    .browser-check { opacity:0; width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:rgba(139,124,247,.2); color:#c8bfff; font-size:12px; font-weight:800; }
    .browser-option.selected .browser-check { opacity:1; }
    @media (max-width:560px) { .browser-card-head { flex-direction:column; } .browser-current { align-self:flex-start; } }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-blob a"></div>
    <div class="ambient-blob b"></div>
    <div class="ambient-blob c"></div>
  </div>

  <div id="browser-chrome">
    <div id="tab-bar">
      <div class="tab active" id="home-tab" onclick="BrowserTabs.switchTab('home')">
        <img class="tab-favicon" src="favicon.png" onerror="this.style.display='none'">
        <span class="tab-title">Settings</span>
      </div>
      <button id="new-tab-btn" onclick="BrowserTabs.openTab(null)" title="New Tab">+</button>
      <div id="page-nav">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="apps.html">Apps</a>
        <a href="settings.html" class="active">Settings</a>
      </div>
    </div>
    <div id="address-bar-row">
      <button class="nav-btn" id="btn-back" onclick="BrowserTabs.tabBack()" title="Back">&#8592;</button>
      <button class="nav-btn" id="btn-forward" onclick="BrowserTabs.tabForward()" title="Forward">&#8594;</button>
      <button class="nav-btn" id="btn-reload" onclick="BrowserTabs.tabReload()" title="Reload">&#8635;</button>
      <input id="address-input" class="home-tab" type="text" value="Settings" autocomplete="off"
             onfocus="BrowserTabs.addressFocus()" onblur="BrowserTabs.addressBlur()"
             onkeydown="if(event.key==='Enter')BrowserTabs.addressGo()">
      <button class="nav-btn" onclick="BrowserTabs.switchTab('home')" title="Home">⌂</button>
    </div>
  </div>
  <div id="chrome-height-spacer"></div>
  <div id="tab-content-area">
    <div id="home-frame" class="active">
      <div id="settings-inner">
        <div class="s-card browser-card">
          <div class="browser-card-head">
            <div>
              <h3>Search browser</h3>
            </div>
            <span class="browser-current" id="browser-current">Dizzy</span>
          </div>
          <div class="browser-list" id="browser-list">
            <button class="browser-option dizzy-option" data-engine="dizzy" type="button">
              <span class="browser-icon dizzy-icon"><img src="favicon.png" alt="Dizzy" class="engine-logo"></span>
              <span class="browser-option-copy"><strong>Dizzy</strong></span>
              <span class="browser-check">✓</span>
            </button>
            <button class="browser-option" data-engine="duckduckgo" type="button">
              <span class="browser-icon"><img src="https://duckduckgo.com/favicon.ico" alt="DuckDuckGo" class="engine-logo"></span>
              <span class="browser-option-copy"><strong>DuckDuckGo</strong></span>
              <span class="browser-check">✓</span>
            </button>
            <button class="browser-option" data-engine="google" type="button">
              <span class="browser-icon"><img src="https://www.google.com/favicon.ico" alt="Google" class="engine-logo"></span>
              <span class="browser-option-copy"><strong>Google</strong></span>
              <span class="browser-check">✓</span>
            </button>
            <button class="browser-option" data-engine="bing" type="button">
              <span class="browser-icon"><img src="https://www.bing.com/favicon.ico" alt="Bing" class="engine-logo"></span>
              <span class="browser-option-copy"><strong>Bing</strong></span>
              <span class="browser-check">✓</span>
            </button>
            <button class="browser-option" data-engine="yahoo" type="button">
              <span class="browser-icon"><img src="https://search.yahoo.com/favicon.ico" alt="Yahoo" class="engine-logo"></span>
              <span class="browser-option-copy"><strong>Yahoo</strong></span>
              <span class="browser-check">✓</span>
            </button>
          </div>
        </div>

        <div class="s-card">
          <h3>Tab cloak</h3>
          <div class="s-row">
            <label>Title</label>
            <input id="cloak-title" type="text" placeholder="Dizzy">
          </div>
          <div class="s-row">
            <label>Favicon URL</label>
            <input id="cloak-favicon" type="text" placeholder="favicon.png">
          </div>
          <div class="s-row">
            <label>Preset</label>
            <select id="cloak-preset">
              <option value="">Custom</option>
              <option value="classroom">Google Classroom</option>
              <option value="drive">Google Drive</option>
              <option value="docs">Google Docs</option>
              <option value="gmail">Gmail</option>
              <option value="canvas">Canvas</option>
            </select>
          </div>
          <div class="s-actions">
            <button type="button" class="s-btn" id="cloak-save">Save</button>
            <button type="button" class="s-btn ghost" id="cloak-reset">Reset</button>
          </div>
        </div>
        <div class="s-card">
          <h3>Panic</h3>
          <div class="s-row">
            <label>Key</label>
            <input id="panic-key" type="text" maxlength="2" placeholder="`">
          </div>
          <div class="s-row">
            <label>URL</label>
            <input id="panic-url" type="text" placeholder="https://classroom.google.com/">
          </div>
          <div class="s-actions">
            <button type="button" class="s-btn" id="panic-save">Save</button>
            <button type="button" class="s-btn ghost" id="panic-test">Test</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="uv/uv.bundle.js" defer></script>
  <script src="uv/uv.config.js" defer></script>
  <script src="register-sw.js" defer></script>
  <script src="search.js" defer></script>
  <script src="browser.js" defer></script>
  <script>
    // Warm UV as soon as config exists
    (function warm() {
      if (typeof __uv$config === 'undefined' || typeof registerSW !== 'function') {
        return setTimeout(warm, 50);
      }
      registerSW().catch(function(){});
    })();
  </script>
  <script defer>
    function setupBrowserPicker() {
      var key = 'dizzy_search_engine';
      var names = { duckduckgo:'DuckDuckGo', google:'Google', bing:'Bing', yahoo:'Yahoo', dizzy:'Dizzy' };
      var current = 'dizzy';
      try { current = localStorage.getItem(key) || 'dizzy'; } catch (e) {}
      if (!names[current]) current = 'dizzy';
      var currentEl = document.getElementById('browser-current');
      var options = document.querySelectorAll('.browser-option');
      function render() {
        options.forEach(function (btn) {
          var selected = btn.getAttribute('data-engine') === current;
          btn.classList.toggle('selected', selected);
          btn.setAttribute('aria-pressed', selected ? 'true' : 'false');
        });
        if (currentEl) currentEl.textContent = names[current];
      }
      options.forEach(function (btn) {
        btn.addEventListener('click', function () {
          current = btn.getAttribute('data-engine') || 'dizzy';
          try { localStorage.setItem(key, current); } catch (e) {}
          render();
        });
      });
      render();
    }

    document.addEventListener('DOMContentLoaded', function () {
      setupBrowserPicker();
      if (window.BrowserTabs) BrowserTabs.init({ homeLabel: 'Settings' });
      var presets = {
        classroom: { title: 'Home', favicon: 'https://ssl.gstatic.com/classroom/favicon.png' },
        drive: { title: 'My Drive - Google Drive', favicon: 'https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png' },
        docs: { title: 'Google Docs', favicon: 'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico' },
        gmail: { title: 'Inbox', favicon: 'https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico' },
        canvas: { title: 'Canvas', favicon: 'https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico' }
      };
      var cfg = DizzyCloak.load();
      document.getElementById('cloak-title').value = cfg.title || '';
      document.getElementById('cloak-favicon').value = cfg.favicon || '';
      document.getElementById('panic-key').value = cfg.panicKey || '`';
      document.getElementById('panic-url').value = cfg.panicUrl || 'https://classroom.google.com/';

      document.getElementById('cloak-preset').addEventListener('change', function () {
        var p = presets[this.value];
        if (!p) return;
        document.getElementById('cloak-title').value = p.title;
        document.getElementById('cloak-favicon').value = p.favicon;
      });

      document.getElementById('cloak-save').onclick = function () {
        var c = DizzyCloak.load();
        c.title = document.getElementById('cloak-title').value.trim() || 'Dizzy';
        c.favicon = document.getElementById('cloak-favicon').value.trim() || 'favicon.png';
        DizzyCloak.save(c);
        DizzyCloak.apply(c);
      };
      document.getElementById('cloak-reset').onclick = function () {
        var c = DizzyCloak.load();
        c.title = 'Dizzy';
        c.favicon = 'favicon.png';
        DizzyCloak.save(c);
        DizzyCloak.apply(c);
        document.getElementById('cloak-title').value = c.title;
        document.getElementById('cloak-favicon').value = c.favicon;
        document.getElementById('cloak-preset').value = '';
      };
      document.getElementById('panic-save').onclick = function () {
        var c = DizzyCloak.load();
        c.panicKey = document.getElementById('panic-key').value || '`';
        c.panicUrl = document.getElementById('panic-url').value.trim() || 'https://classroom.google.com/';
        DizzyCloak.save(c);
      };
      document.getElementById('panic-test').onclick = function () {
        DizzyCloak.panic();
      };
    });
  </script>
  <div id="site-footer">made by wes</div>
</body>
</html>
