<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dizzy</title>
  <link rel="icon" type="image/png" href="/ultra-prox/favicon.png">
  <link rel="stylesheet" href="/ultra-prox/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Oswald&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header">
    <img src="/ultra-prox/logo.png" alt="Wes Prox Logo">
  </div>

  <div id="content">
    <h1 id="site-title">Dizzy</h1>
    <form id="uv-form">
      <input id="uv-search-engine" value="https://duckduckgo.com/?q=%s" type="hidden">
      <input id="uv-address" type="text" placeholder="Search or enter a URL" class="form__input" autocomplete="off">
    </form>
    <div style="text-align:center;margin-top:10px;">
      <p id="uv-error" style="color:#f66;font-size:13px;"></p>
      <pre id="uv-error-code" style="color:#888;font-size:11px;white-space:pre-wrap;"></pre>
    </div>
  </div>


  <script src="/ultra-prox/uv/uv.bundle.js"></script>
  <script src="/ultra-prox/uv/uv.config.js"></script>
  <script src="/ultra-prox/register-sw.js"></script>
  <script src="/ultra-prox/search.js"></script>
  <script src="/ultra-prox/index.js"></script>

  <div id="footer"><p>&copy; Made by Wes</p></div>
</body>
</html>
