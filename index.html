<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <nav style="display:flex;justify-content:center;gap:8px;padding:18px 20px 0;border-bottom:1px solid #1c1c28;background:#0a0a0f;position:sticky;top:0;z-index:100;">
    <a href="index.html" style="text-decoration:none;color:#fff;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:8px 18px;border-radius:8px 8px 0 0;border:1px solid #2a2a35;border-bottom:1px solid #0a0a0f;background:#14141c;margin-bottom:-1px;font-family:'Open Sans',sans-serif;">Home</a>
    <a href="games.html" style="text-decoration:none;color:#888;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:8px 18px;border-radius:8px 8px 0 0;border:1px solid transparent;font-family:'Open Sans',sans-serif;">Games</a>

  <div id="header">
    <img src="obsidianlogo.png" alt="Dizzy" onerror="this.onerror=null;this.src='logo.gif';">
  </div>
  <div id="content">
    <h1 id="site-title">Dizzy | By Wes</h1>
    <form id="uv-form">
      <input id="uv-search-engine" value="https://duckduckgo.com/?q=%s" type="hidden">
      <input id="uv-address" type="text" placeholder="Search or enter a URL" class="form__input" autocomplete="off">
    </form>
    <div style="text-align:center;margin-top:10px;">
      <p id="uv-error" style="color:#f66;font-size:13px;"></p>
      <pre id="uv-error-code" style="color:#888;font-size:11px;white-space:pre-wrap;"></pre>
    </div>
    <!-- Quick link circles — each navigates through the proxy -->
    <div style="display:flex;justify-content:center;gap:28px;padding:22px 20px 8px;">
      <button onclick="proxyNav('https://tiktok.com')" style="display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#888;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-family:'Open Sans',sans-serif;background:none;border:none;cursor:pointer;">
        <div style="width:54px;height:54px;border-radius:50%;background:#14141c;border:1px solid #2a2a35;overflow:hidden;display:flex;align-items:center;justify-content:center;">
          <img src="tiktok.png" alt="TikTok" style="width:100%;height:100%;object-fit:cover;">
        </div>
        TikTok
      </button>
      <button onclick="proxyNav('https://discord.com')" style="display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#888;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-family:'Open Sans',sans-serif;background:none;border:none;cursor:pointer;">
        <div style="width:54px;height:54px;border-radius:50%;background:#14141c;border:1px solid #2a2a35;overflow:hidden;display:flex;align-items:center;justify-content:center;">
          <img src="discord.png" alt="Discord" style="width:100%;height:100%;object-fit:cover;">
        </div>
        Discord
      </button>
      <button onclick="proxyNav('https://roblox.com')" style="display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#888;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-family:'Open Sans',sans-serif;background:none;border:none;cursor:pointer;">
        <div style="width:54px;height:54px;border-radius:50%;background:#14141c;border:1px solid #2a2a35;overflow:hidden;display:flex;align-items:center;justify-content:center;">
          <img src="roblox.png" alt="Roblox" style="width:100%;height:100%;object-fit:cover;">
        </div>
        Roblox
      </button>
      <button onclick="proxyNav('https://spotify.com')" style="display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#888;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-family:'Open Sans',sans-serif;background:none;border:none;cursor:pointer;">
        <div style="width:54px;height:54px;border-radius:50%;background:#14141c;border:1px solid #2a2a35;overflow:hidden;display:flex;align-items:center;justify-content:center;">
          <img src="spotify.png" alt="Spotify" style="width:100%;height:100%;object-fit:cover;">
        </div>
        Spotify
      </button>
    </div>
    <script>
      function proxyNav(url) {
        if (typeof __uv$config === 'undefined') return;
        location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
      }
    </script>
  </div>
  <script src="uv/uv.bundle.js"></script>
  <script src="uv/uv.config.js"></script>
  <script src="register-sw.js"></script>
  <script src="search.js"></script>
  <script src="index.js"></script>
  <div id="footer"><p>© 2026 Crown Games. All rights reserved.</p></div>
</body>
</html>
