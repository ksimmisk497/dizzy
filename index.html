<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  var embed = /(?:\?|&)embed=1(?:&|$)/.test(location.search) || window !== window.top;
  if (embed) document.documentElement.classList.add("dizzy-embed");
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dizzy</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="browser.css">
<style>
#home-frame {
  overflow: auto;
}

.home {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(123, 108, 255, 0.12), transparent 70%);
}

/* Floating logo above search */
.home-mascot {
  width: auto;
  height: 200px;
  max-width: 90vw;
  display: block;
  margin: 0 0 28px;
  border: 0;
  outline: 0;
  box-shadow: none;
  background: transparent;
  object-fit: contain;
  filter: drop-shadow(0 0 28px rgba(155, 92, 255, 0.5));
  animation: dizzyLogoBob 5s ease-in-out infinite;
  will-change: transform;
}

@keyframes dizzyLogoBob {
  0%   { transform: translate3d(0, 0, 0); }
  50%  { transform: translate3d(0, -11px, 0); }
  100% { transform: translate3d(0, 0, 0); }
}

.search-wrap {
  width: min(460px, 92vw);
  position: relative;
  margin-bottom: 28px;
  animation: searchIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
}

@keyframes searchIn {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.search-wrap input {
  width: 100%;
  padding: 15px 18px 15px 44px;
  border-radius: 16px;
  border: 1px solid rgba(155, 92, 255, 0.45);
  background: #120a1c;
  color: #f5eaff;
  font-family: var(--font), system-ui, sans-serif;
  font-size: 14px;
  outline: none;
}

.search-wrap input:focus {
  border-color: #7b6cff;
  box-shadow: 0 0 0 4px rgba(123, 108, 255, 0.2), 0 0 28px rgba(123, 108, 255, 0.25);
}

.search-wrap::before {
  content: "⌕";
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #7a5a9a;
  font-size: 16px;
  pointer-events: none;
}

.quick {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  animation: quickIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
}

@keyframes quickIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

.quick button {
  width: 72px;
  padding: 10px 6px 8px;
  border-radius: 14px;
  border: 1px solid rgba(155, 92, 255, 0.35);
  background: #120a1c;
  color: #b89ad4;
  font-family: var(--font), system-ui, sans-serif;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.18s ease;
  animation: btnPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.quick button:nth-child(1) { animation-delay: 0.18s; }
.quick button:nth-child(2) { animation-delay: 0.24s; }
.quick button:nth-child(3) { animation-delay: 0.3s; }
.quick button:nth-child(4) { animation-delay: 0.36s; }

@keyframes btnPop {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

.quick button:hover {
  background: #1a0f2e;
  border-color: rgba(192, 132, 252, 0.55);
  color: #fff;
  transform: translateY(-2px);
}

.quick img {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  object-fit: contain;
  display: block;
  margin: 0 auto 6px;
  background: transparent;
}
</style>
<style id="full-bleed-fix">
html, body {
  width: 100% !important;
  height: 100% !important;
  overflow: hidden !important;
}
#tab-content-area {
  position: fixed !important;
  top: var(--chrome-h) !important;
  left: var(--rail) !important;
  right: 0 !important;
  bottom: 0 !important;
  width: auto !important;
  height: auto !important;
}
#home-frame,
.tab-frame,
#tab-content-area iframe {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  border: 0 !important;
  max-width: none !important;
  max-height: none !important;
}
#home-frame.active,
.tab-frame.active {
  display: block !important;
}
</style>
</head>
<body>
<nav class="rail" aria-label="Main">
  <img class="rail-logo" src="favicon.png" alt="Dizzy">
  <a href="index.html" class="active" data-label="Home"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg></a>
  <a href="games.html" data-label="Games"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="3"/><path d="M8 12h2M7 10v4M16 11h.01M18 13h.01"/></svg></a>
  <a href="apps.html" data-label="Apps"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></a>
  <a href="settings.html" data-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></a>
  <div class="rail-spacer"></div>
</nav>

<div id="browser-chrome">
  <div id="tab-bar">
    <div class="tab active" id="home-tab" onclick="BrowserTabs.switchTab('home')">
      <img class="tab-favicon" src="favicon.png" onerror="this.style.display='none'">
      <span class="tab-title">New Tab</span>
    </div>
    <button id="new-tab-btn" onclick="BrowserTabs.openTab(null)" title="New Tab">+</button>
  </div>
  <div id="address-bar-row">
    <button class="nav-btn" id="btn-back" onclick="BrowserTabs.tabBack()">&#8592;</button>
    <button class="nav-btn" id="btn-forward" onclick="BrowserTabs.tabForward()">&#8594;</button>
    <button class="nav-btn" id="btn-reload" onclick="BrowserTabs.tabReload()">&#8635;</button>
    <input id="address-input" class="home-tab" type="text" value="New Tab" autocomplete="off"
           onfocus="BrowserTabs.addressFocus()" onblur="BrowserTabs.addressBlur()"
           onkeydown="if(event.key==='Enter')BrowserTabs.addressGo()">
  </div>
</div>

<div id="tab-content-area">
  <div id="home-frame" class="active">
    <div class="home">
      <img class="home-mascot" src="logo.png" alt="Dizzy" width="520" height="200">
      <form class="search-wrap" onsubmit="homeSearch(event)">
        <input id="home-search" type="text" placeholder="Search the web" autocomplete="off">
      </form>
      <div class="quick">
        <button type="button" onclick="BrowserTabs.openTab('https://tiktok.com')"><img src="tiktok.png" alt="">TikTok</button>
        <button type="button" onclick="BrowserTabs.openTab('https://tubitv.com')"><img src="movie.png" alt="">Movies</button>
        <button type="button" onclick="BrowserTabs.openTab('https://ask-chat.ai')"><img src="spotify.png" alt="">AI</button>
        <button type="button" onclick="BrowserTabs.openTab('https://roblox.com')"><img src="roblox.png" alt="">Roblox</button>
      </div>
    </div>
  </div>
</div>

<script src="uv/uv.bundle.js" defer></script>
<script src="uv/uv.config.js" defer></script>
<script src="register-sw.js" defer></script>
<script src="search.js" defer></script>
<script src="browser.js"></script>
<script src="cloak.js"></script>
<script src="browser-ua.js"></script>
<script>
if (window.BrowserTabs) BrowserTabs.init({ homeLabel: 'New Tab' });
function homeSearch(e) {
  e.preventDefault();
  var raw = document.getElementById('home-search').value.trim();
  if (!raw) return;
  document.getElementById('home-search').value = '';
  if (window.BrowserTabs) BrowserTabs.openTab(raw); else location.href = raw;
}
</script>
<script src="teacher-watch.js"></script>
<script src="notifications.js"></script>
</body>
</html>
